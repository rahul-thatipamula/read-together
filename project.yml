name: ReadTogether
options:
  bundleIdPrefix: app.readtogether
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  ReadTogether:
    type: application
    platform: macOS
    sources:
      - path: ReadTogether
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
    info:
      path: ReadTogether/Resources/Info.plist
      properties:
        CFBundleName: Read Together
        CFBundleDisplayName: Read Together
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.education
        NSSupportsAutomaticTermination: false
    entitlements:
      path: ReadTogether/Resources/ReadTogether.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_NAME: Read Together
        PRODUCT_BUNDLE_IDENTIFIER: app.readtogether.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
